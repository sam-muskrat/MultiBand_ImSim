# Example configuration file 
#   for MultiBand_ImSim v0.3 
# Created by lshuns (2021-06-24 12:18:56)
# Note: If you do not use certain sections, just leave them whatever they are.
#         They will not be loaded.


################################## Paths ################################################
[Paths]

config_dir =  /home/users/samjc/MultiBand_ImSim/config/                       # directory to all the configuration files
out_dir =   /scratch/users/samjc/output


################################## GalInfo ##############################################
[GalInfo]

cata_file =        /scratch/users/samjc/catalogs/galaxies/skills_v07Ds_input_part0.feather
                                               # supported file types: feather, csv, fits
position_type =         true                   # position to be used
                                               #    true (use positions from the input catalogue)
                                               #    grid (put in a grid)
                                               #    random (put in random)
grid_size =             18.                    # (arcsec) box size for grid
                                               # default: 18 arcsec
                                               # not used in other position_type
mag_cut =               16, 27                # magnitude cut for galaxies to be simulated
Re_cut =                0, 99                  # size cut for galaxies to be simulated (arcsec)
# catalogue column names to the desired info
id_name =               index                  # unique galaxy id
detection_mag_name =    r_SDSS_apparent_corr                      # correspond to the `detection_band` in [ImSim]
mag_name_list =         r_SDSS_apparent_corr
                                              # correspond to the the `band_list` in [ImSim]
RaDec_names =           ra, dec
shape_names =           Re_arcsec, shape/sersic_n, BA, PA_random, none, none, none, none, none, none
                                               # order: 
                                               #    Re (in arcsec!), sersic_n, axis_ratio, PA, 
                                               #    bulge_fraction, bulge_Re (in arcsec!), bulge_axis_ratio, bulge_sersic_n, 
                                               #    disk_Re (in arcsec!), disk_axis_ratio
                                               # not all required, for those missed, simply feed none
z_name =                zobs                   # column name for redshift
                                               #    not used, only for saving


################################## StarInfo ##############################################
[StarInfo]

cata_file =  /scratch/users/samjc/catalogs/stars/trilegal_9band_135.0_0.0_10deg2_default.feather
                                               # supported file types: feather, csv, fits
                                               # leave it as empty if stars are not needed
cata_area =             10                      # square degrees
                                               # sky area spanned by the input catalogue
                                               # should be equal or larger than the tile area
position_type =         random                 # position to be used
                                               #    random (randomly place the stars)
                                               #    true (use positions from the input catalogue)
mag_cut =               14, 27                 # magnitude cut for stars to be simulated
# column names to the desired info
id_name =               index                  # unique star id
detection_mag_name =    r                      # correspond to the `detection_band` in [ImSim] 
mag_name_list =         r
                                               # correspond to the the `band_list` in [ImSim]
RaDec_names =           ra, dec                # not required, if stars are randomly placed


################################## NoiseInfo ##############################################
[NoiseInfo]

cata_file = /home/users/samjc/MultiBand_ImSim/noise_info/Euclid_Q1_median_LSST10yr_repeated50.csv     # input noise background & psf catalogue
                                               # supported file types: feather, csv, fits
                                               # NOTE: tiles are orderly selected
#noise_psf_basenames =   label, rms_LSST, InputSeeing_LSST, InputBeta_LSST, none, none, none, none
                                               # base names for noise and psf info
                                               # order: 
                                               #    label, rms, seeing, MoffatBeta, psf_e1, psf_e2, chip_id, expo_id
                                               # the real column name is associated with band labels as `rms_r` etc
                                               # not all required, for those missed, simply feed none
                                               # chip_id & expo_id are for file4varChips, not used otherwise
#file4varChips =         ../noise_info/Euclid_Q1_median_LSST10yr_repeated50.csv
                                               # a separate psf info catalogue for varChips mode (see ImSim)
                                               # not required for other modes
#psf_PixelIma_dir =                             # directory contains psf images

label_basename =        label                  # column name for label
noise_basenames =       rms_LSST                # base names for noise background
                                               # order: rms
                                               # the real column name is associated with band labels as `rms_r` etc
psf_basenames_moffat =  InputSeeing_LSST, InputBeta_LSST
                                               # base names for psf profile
                                               # used by psf_type == Moffat
                                               # order:
                                               #    seeing, MoffatBeta, e1, e2
                                               # the real column name is associated with band labels
                                               # not all required, for those missed, simply ignore or feed none
#psf_basenames_airy =    lam, diam, obscuration, psf_e1, psf_e2
                                               # base names for psf profile
                                               # used by psf_type == Airy
                                               # order:
                                               #    lam (in nanometre), diam (in metre), obscuration, e1, e2
                                               # the real column name is associated with band labels
                                               # not all required, for those missed, simply ignore or feed none
#id_basenames =          chip_id, expo_id       # column names for IDs used by file4varChips
                                               # not used otherwise
                                               # order: chip_id, expo_id
psf_type_list =         Moffat, Moffat, Moffat, Moffat, Moffat, Moffat, Moffat, Moffat, Moffat
                                               # PSF profile list, same order as band_list
                                               # supported types:
                                               #    Moffat, Airy, PixelIma

################################## ImSim ###################################################
[ImSim]

survey =              simple_0.05sqdeg                     # survey being simulated
                                               # current supported surveys:
                                               #    one_tile: simple one image including all the galaxies
                                               #    simple_Nsqdeg: N can be any float corresponding to the tile sky area
                                               #    KiDS: KiDS-like images (5 exposures, dither patterns and chip gaps)
band_list =             r
                                               # bands being simulated
pixel_scale_list =      0.2					   # pixel scale for each band image

image_type_list =      simple
                                               # image type for each band
                                               # current supported types:
                                               #    simple: without any survey feature (a simple stacked image)
                                               #    sameExpo: different exposures use the same noise&PSF info
                                               #    diffExpo: different exposures use different noise&PSF info
image_chips =           False
                                               # save individual chips or not
                                               # required by lensfit
image_PSF =             True
                                               # save individual psf
                                               # required by lensfit
image_PSF_size =        48                     # (pixels) the size of the saved PSF image
                                               #    it is assumed to be a square
                                               #    default: 32*32

image_noise =           True
                                               # save noise-only images
                                               # required by metadetect

N_tiles =               1                      # number of tiles to be simulated\n\
                                               # make sure the NoiseInfo cata covers more than this requirement
                                               # GalInfo can cover less than this requirement,
                                               #    in which case repeating patterns will be produced
                                               # NOTE: the total output tiles = N_tiles * N_rotations (specified below)
gal_rotation_angles =   0                      # degrees (put more values separated with ',' if needed)
PSF_map =               False                  # output the corresponding PSF map or not
                                               # can be used by GAaP, but not mandatory if stars are simulated
mag_zero =              30                     # simulated magnitude zero point


################################## SExtractor #################################################
[SExtractor]

# for detection
cmd =                   sex                    # the executable path to the SExtractor code
detection_band =        r                      # band for detection
image_label =           original                  # label for the image type, can be either:
                                               #    original (for original simulated images)
                                               #    any label specified in `swarp_labels`
pixel_scale =           0.2                   # pixel scale for the image
cross_match =           True                   # cross-match with the input catalogue
                                               #    in which case, catalogues with match info will be saved
                                               #    see next section for configuration
config_file =           kids_sims.sex          # SExtractor configuration file
param_file =            sex_image.param        # SExtractor parameter file
filter_file =           default.conv           # SExtractor filter file
starNNW_file =          default.nnw            # SExtractor Neural-Network_Weight table file
checkimage_type =       NONE                   # can be one of 
                                               # NONE, BACKGROUND, MINIBACKGROUND, OBJECTS, SEGMENTATION, APERTURES, FILTERED
clean_up_level =        0                      # clean up level
                                               #    0: none
                                               #    1: original images
                                               #    2: and .sex files


################################## CrossMatch #################################################
[CrossMatch]

mag_faint_cut =         26                     # faintest sources can be possible detected
                                               # for the sake of speed-up
save_matched =          True                   # save the matched object info
save_false =            True                   # save false-detected object info
save_missed =           True                   # save the missed object info
mag_closest =           True                   # use magnitude to select for duplicated match
r_max =                 0.6                    # (arcsec) allowed maximum separation



################################## MeasureShape #################################################
[MeasureShape]

method =                metadetect             # method for galaxy shape measurement
                                               # supported method:
                                               #    lensfit (require lensfit source code)
                                               #    ams (FindAdaptiveMom in GalSim)
                                               #    hsm (EstimateShear in GalSim)
                                               #    metadetect (metadetection) 
detection_band =        r                      # band with detection catalogue
band_list =             r
                                               # bands being measured
image_label_list =      original
                                               # a list of labels for the image types, can be either:
                                               #    original (for original simulated images)
                                               #    any label specified in `swarp_labels`
                                               # NOTE: lensfit uses individual exposures, so it is `original`


[lensfit]

lensfit_dir =           your_dir_to_lensfit
                                               # directory containing lensfit code
lensfit_cores =         48                     # number of cores used by each lensfit run
                                               # should be consistent with that compiled in lensfit (flensfit_NT[lensfit_cores])
psf_folder_prefix =     psf_coeff              # prefix of prefix of folders saving PSF models

# some lensfit-related values
postage_size =          48
start_exposure =        1
end_exposure =          5
start_mag =             20.0
end_mag =               25.0
PSF_OVERSAMPLING =      1
PECUT =                 0.02
PRCUT =                 0.02
LCUT =                  0.05
CAMERA =                KIDS
lensfit_type =          flensfit               # 309 using flensfit, 321 using lensfit
lensfit_version =       309                    # current supported version: 309, 321
MEMORY_LIMIT =          30000                  # only relevant for 321
clean_up_level =        0                      # clean up level
                                               #    0: none
                                               #    1: tmp directory


[ams]

postage_size =          48                     # postage size in pixel
sigma_fromSNR_amp =     1.16                   # amplitude for e_err and SNR relation
sigma_fromSNR_index =   0.62                   # index for e_err and SNR relation
sigma_fromSNR_base =    0.05                   # base for e_err and SNR relation
sigma_intrinsic =       0.27                   # intrinsic sigma e
guess_sig =             5.0                    # initial guess for the sigma of the object (in pixels)
precision =             1e-6                   # convergence criterion for the moments
round_moments =         False                  # use a circular weight function instead of elliptical
save_Nstamps =          0                      # number of stamps saved for visual check


[hsm]

postage_size =          48                     # postage size in pixel
same_PSF =              True                   # whether all objects have the same PSF
sigma_fromSNR_amp =     7.26                   # amplitude for e_err and SNR relation
sigma_fromSNR_index =   0.02                   # index for e_err and SNR relation
sigma_fromSNR_base =    -6.6                   # base for e_err and SNR relation
sigma_intrinsic =       0.27                   # intrinsic sigma e
shear_est =             KSB                    # shear estimation method
                                               # supported methods:
                                               #    REGAUSS, LINEAR, BJ, or KSB
recompute_flux =        NONE                   # recompute the flux or not
guess_sig_gal =         5.0                    # initial guess for the sigma of the galaxy (in pixels)
guess_sig_PSF =         3.0                    # initial guess for the sigma of the PSF (in pixels)
precision =             1e-6                   # convergence criterion for the moments
save_Nstamps =          0                      # number of stamps saved for visual check


[metadetect]

same_PSF =              True                   # whether all objects have the same PSF
config_files =          metadetect_config.json # metadetect config file in the config folder
                                               #    file number matches with number of bands to be measured
pixel_scale_list =      0.2                    # the measured images' pixel scales
                                               #    should match with what have been simulated
cell_size =             500                    # the cell size for metadetection
                                               #    should be even number
central_size =          400                    # the central size for metadetection
                                               #    should be even number and smaller than cell size
save_Ncells =           4                      # number of cells saved for visual check





################################## CombineCata ###################################################
[CombineCata]

file_format =              fits                # output file format
                                               # supported formats:
                                               #    fits, feather, csv
clean_up_level =        0                      # clean up level
                                               #    0: none
                                               #    1: all itermediate catalogues (that is ALL, so be very careful!)
